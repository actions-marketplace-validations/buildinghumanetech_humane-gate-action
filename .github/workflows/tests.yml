name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No API key, no network, no spend.
      - run: python tests/base_branch_policy.py
      - run: python tests/default_policy.py
